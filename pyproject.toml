[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyFeldmanCousins"
version = "0.20.0"
description = "A modular framework for Feldman-Cousins confidence interval calculations."
readme = "README.md"
# 3.9, not 3.8. The declaration used to say 3.8 but nothing ever checked it: CI has only
# ever run 3.9/3.10/3.11. Measured on a real 3.8 environment, 141 of the 148 tests pass --
# but `toys.py`'s ProcessPoolExecutor recovery path deadlocks, hanging indefinitely rather
# than falling back to threads.
#
# That one is not fixable from here. CPython rewrote `concurrent.futures.process` in 3.9
# (`_ExecutorManagerThread`, and the `cancel_futures` argument to `shutdown`); 3.8's
# legacy queue-management implementation is what hangs when a pool breaks, and the same
# non-blocking shutdown that fixes 3.9 does not rescue it. Since the path is reachable by
# any user who passes a lambda or a closure, and 3.8 has been end-of-life since October
# 2024, the honest declaration is the one CI actually tests.
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Mauricio Bustamante", email = "mbustamante@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
    "numpy>=1.20",
    "scipy",
    "matplotlib",
    "numba"
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
dev = ["pytest", "pytest-cov", "twine", "build"]
docs = ["sphinx", "sphinx-rtd-theme", "sphinxcontrib-bibtex"]
optimizers = ["ultranest", "tqdm"]

[project.urls]
Homepage = "https://github.com/mbustama/FeldmanCousins"
Repository = "https://github.com/mbustama/FeldmanCousins.git"
Issues = "https://github.com/mbustama/FeldmanCousins/issues"

[project.scripts]
pyfc-config = "pyfc.generate_config:main"

[tool.setuptools.packages.find]
where = ["."]

# Without this filter, setuptools treats every top-level directory in the repository as a
# package to install.  The 0.10.0 wheel shipped `tests`, `scripts`, `docs` and
# `xbranch_compare` as top-level packages, so `pip install PyFeldmanCousins` dropped a
# top-level `tests` module into the user's site-packages, where it shadows or is shadowed
# by any other project's `tests` -- a genuine, hard-to-diagnose collision that has nothing
# to do with this package's purpose.  `pyfc*` also admits future subpackages
# (`pyfc.something`) without needing to be revisited.
include = ["pyfc*"]

[tool.coverage.run]
# `pyfc` is the import package; `PyFeldmanCousins` is only the distribution name, and
# coverage measures imported source.  Naming it explicitly also keeps the measurement
# scoped to the library itself: `tests/` and `xbranch_compare/` sit at the repository
# root next to `pyfc/`, and neither is code whose coverage is meaningful.
source = ["pyfc"]

# Branch coverage, not just line coverage.  Line coverage flatters this codebase: the
# orchestrator is a dispatch machine, and most of what can go wrong in it is a branch that
# is only ever taken one way -- `strategy="grid"` vs `"adaptive"`, a resumed checkpoint vs
# a fresh run, the disconnected-interval reporting path, and the `if ultranest is None`
# guards around every optional-dependency call site.  A line-coverage number counts those
# as covered the moment the function runs at all; only branch coverage reports whether the
# other side was ever exercised.
branch = true

# Trace inside ProcessPoolExecutor workers.  `toys.py`'s unbinned path dispatches every toy
# to `_worker_unbinned_toy` in a child process, and coverage does not follow subprocesses
# by default -- so that function, and everything it calls, was reported as entirely missed
# despite being exercised end to end by
# `test_unbinned_toys.py::test_compute_fc_intervals_unbinned_end_to_end_produces_finite_intervals`.
# Measured on that one file, this takes `toys.py` from 26% to 37% without a single new
# test, because the lines were always running; they were merely invisible.
#
# This is the same class of error as the numba problem that `scripts/run_coverage.sh`
# exists for, and it is the more dangerous of the two: a plausible-looking 62% invites
# someone to write tests for code that is already covered, which adds maintenance burden
# and moves no real risk.  `parallel` is required for `concurrency` to work (each process
# writes its own data file); pytest-cov combines them automatically.
#
# BOTH values are required, and "thread" is not redundant with coverage's default.  Setting
# `concurrency` at all REPLACES the default rather than adding to it, so naming only
# "multiprocessing" silently stops tracing threads -- and `toys.py`'s *binned* path runs
# every toy through a ThreadPoolExecutor, so that swap trades one blind spot for another.
# Measured over `test_adaptive_toys.py` + `test_unbinned_toys.py`, which between them
# exercise both pools:
#
#     thread (the default)      58%   -- loses the process worker
#     multiprocessing           61%   -- loses the thread body
#     multiprocessing, thread   70%   -- loses neither
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true

# Deliberately no `fail_under`.  A threshold picked before the first measurement either
# sits below the real number and never fires, or above it and blocks unrelated work; the
# number to pin is one the suite has actually been held to for a while.
exclude_also = [
    # Import-time guards for running a module as a script; unreachable under pytest.  When
    # the matched line introduces a block, coverage excludes the whole block, which is what
    # matters here: `orchestrator.py`'s demo block runs from line 931 to end of file, 181
    # lines, ~16% of the module.  Counting it would report a permanent miss that no test
    # can ever close, and one large enough to drown out the gaps that are real.
    "if __name__ == .__main__.:",
]
