name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  # Gate. Publishing to PyPI is the one irreversible action in this repository: a release
  # can be yanked, but a version number can never be reused, so a bad upload is corrected
  # only by burning the number and shipping another. Nothing previously stopped a release
  # created from a commit whose tests were failing -- `pytest.yml` runs on pushes and pull
  # requests, not on `release: published`, so an untested or broken commit reached PyPI
  # exactly as readily as a green one.
  #
  # This repeats the matrix from pytest.yml rather than depending on it. A `workflow_run`
  # link would tie publication to whatever that workflow last happened to do on some
  # branch; running the suite here ties it to the commit actually being published, which is
  # the only thing that matters at this point.
  test:
    name: Test before publishing (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true          # any failure should stop the release, so do not waste the rest
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # `.[test]` without the optimizers extra, matching pytest.yml: that ultranest is
        # optional is part of what is being shipped, so it is part of what is verified.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run pytest
        run: pytest tests/ -q

  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: test          # no green suite on this exact commit, no upload

    # These permissions are required for PyPI Trusted Publisher (OIDC) authentication
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build the package (sdist and wheel)
        run: python -m build

      # - name: Publish package to TestPyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     repository-url: https://test.pypi.org/legacy/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1