name: Code Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Run Ruff Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        # Checks for logical errors, undefined variables, and unused imports
        run: ruff check . --ignore BLE001,C414,SIM102,RUF059,PERF402,TRY201
        # continue-on-error: true # The workflow will turn green even if Ruff complains

      - name: Run Ruff Formatter (Check Only)
        # Fails the CI if the code is not formatted cleanly
        run: ruff format --check .